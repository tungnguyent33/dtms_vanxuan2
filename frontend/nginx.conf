# Gioi han tan suat lop ngoai (backend con mot lop nua: GioiHanTanSuatFilter).
# File nay nam trong conf.d nen duoc nap vao khoi http -> khai bao zone o day hop le.
limit_req_zone $binary_remote_addr zone=dang_nhap:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cong_khai:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anh CCCD toi 5MB
    client_max_body_size 12m;

    # Dang nhap: chong do mat khau
    location = /api/auth/login {
        limit_req zone=dang_nhap burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API cong khai (dang ky truc tuyen, tra cuu, captcha): chong spam
    location /api/public/ {
        limit_req zone=cong_khai burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API -> container backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger (co the chan khi trien khai that)
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
    }

    # React Router: moi duong dan khac tra ve index.html
    location / {
        try_files $uri /index.html;
    }

    # File da bam hash -> cache lau
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
